name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # STAGE 1: Format and Lint Check (GATE)
  # If this fails, ALL subsequent jobs are cancelled
  # ============================================================================
  format-check:
    name: Format & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  # ============================================================================
  # STAGE 2: Test Core + CLI on Linux
  # Only runs if format-check passes
  # ============================================================================
  test-linux:
    name: Test Core + CLI (Linux)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev

      - name: Run tests
        run: cargo test --all --verbose

  # ============================================================================
  # STAGE 3: Test Core + CLI on macOS
  # Only runs if test-linux passes
  # ============================================================================
  test-macos:
    name: Test Core + CLI (macOS)
    needs: test-linux
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --verbose

  # ============================================================================
  # STAGE 4: Test Core + CLI on Windows
  # Only runs if test-macos passes
  # ============================================================================
  test-windows:
    name: Test Core + CLI (Windows)
    needs: test-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --verbose

  # ============================================================================
  # STAGE 5: Build Desktop App (Linux)
  # Only runs if all tests pass AND push to main/dev
  # ============================================================================
  build-desktop-linux:
    name: Build Desktop App (Linux)
    needs: test-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-linux
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/dctx-desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # ============================================================================
  # STAGE 6: Build Desktop App (macOS)
  # Only runs if build-desktop-linux passes
  # ============================================================================
  build-desktop-macos:
    name: Build Desktop App (macOS)
    needs: build-desktop-linux
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-macos
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/dctx-desktop/src-tauri/target/release/bundle/macos/*.app

  # ============================================================================
  # STAGE 7: Build Desktop App (Windows)
  # Only runs if build-desktop-macos passes
  # ============================================================================
  build-desktop-windows:
    name: Build Desktop App (Windows)
    needs: build-desktop-macos
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-windows
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/dctx-desktop/src-tauri/target/release/bundle/nsis/*.exe
