name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # STAGE 1: Format Check (GATE)
  # Ultra-fast, no compilation needed
  # ============================================================================
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ============================================================================
  # STAGE 2: Lint Core + CLI (GATE)
  # Only lints core and CLI, skips desktop app (no Tauri dependencies needed)
  # ============================================================================
  lint-check:
    name: Lint Core + CLI
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy on core and CLI only
        run: cargo clippy -p dctx-core -p dctx-cli -- -D warnings

  # ============================================================================
  # STAGE 3: Test Core + CLI on Linux
  # Only runs if format-check and lint-check pass
  # Tests core and CLI only (desktop app has no tests)
  # ============================================================================
  test-linux:
    name: Test Core + CLI (Linux)
    needs: lint-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (core + CLI only)
        run: cargo test -p dctx-core -p dctx-cli --verbose

  # ============================================================================
  # STAGE 4: Test Core + CLI on macOS
  # Only runs if test-linux passes
  # ============================================================================
  test-macos:
    name: Test Core + CLI (macOS)
    needs: test-linux
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (core + CLI only)
        run: cargo test -p dctx-core -p dctx-cli --verbose

  # ============================================================================
  # STAGE 5: Test Core + CLI on Windows
  # Only runs if test-macos passes
  # ============================================================================
  test-windows:
    name: Test Core + CLI (Windows)
    needs: test-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (core + CLI only)
        run: cargo test -p dctx-core -p dctx-cli --verbose

  # ============================================================================
  # STAGE 6: Lint Desktop App (GATE for builds)
  # Only runs if all core tests pass AND push to main/dev
  # Installs full system dependencies and lints desktop app
  # ============================================================================
  lint-desktop:
    name: Lint Desktop App
    needs: test-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run clippy on desktop app
        run: cargo clippy -p dctx-desktop -- -D warnings

  # ============================================================================
  # STAGE 7: Build Desktop App (Linux)
  # Only runs if desktop lint passes
  # ============================================================================
  build-desktop-linux:
    name: Build Desktop App (Linux)
    needs: lint-desktop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-linux
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/dctx-desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # ============================================================================
  # STAGE 8: Build Desktop App (macOS)
  # Only runs if build-desktop-linux passes
  # ============================================================================
  build-desktop-macos:
    name: Build Desktop App (macOS)
    needs: build-desktop-linux
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-macos
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/dctx-desktop/src-tauri/target/release/bundle/macos/*.app

  # ============================================================================
  # STAGE 9: Build Desktop App (Windows)
  # Only runs if build-desktop-macos passes
  # ============================================================================
  build-desktop-windows:
    name: Build Desktop App (Windows)
    needs: build-desktop-macos
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dctx-desktop-windows
          path: |
            apps/dctx-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/dctx-desktop/src-tauri/target/release/bundle/nsis/*.exe
