name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Clippy and tests
    # The runner is self-hosted: code from forks never runs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, dctx]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "8"
      CARGO_TARGET_DIR: /home/dctx-ci/target
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo nextest --version

      - name: Clippy
        run: >
          cargo clippy --workspace --exclude dctx-desktop --all-targets --
          -D warnings
          -A clippy::field_reassign_with_default
          -A clippy::assertions_on_constants

      - name: Tests
        # Native confinement rejects every descriptor beyond its three protocol pipes.
        # Close runner/shell descriptors before nextest, preserving the bootstrap checks.
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          sys.exit(subprocess.call(
              ["cargo", "nextest", "run", "--workspace", "--exclude", "dctx-desktop", "--no-fail-fast"],
              close_fds=True,
          ))
          PY
