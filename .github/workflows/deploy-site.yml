name: Build and validate website

on:
  # Manual runs build, validate, and save the site as an artifact.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Has the website changed since the last successful run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/deploy_changed.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (GitHub API resolved)
        if: steps.changed.outputs.changed == 'true'
        with:
          python-version: '3.13'
      - name: Install pinned website dependencies in a venv
        if: steps.changed.outputs.changed == 'true'
        run: |
          python -m venv tools/website/.venv
          tools/website/.venv/bin/python -m pip install -r tools/website/requirements.txt
      - name: Build and check website
        if: steps.changed.outputs.changed == 'true'
        # The CLI capture drift check runs in CI.
        run: |
          tools/website/.venv/bin/python tools/website/build.py
          tools/website/.venv/bin/python tools/website/check.py --working-tree --no-capture
      - name: Upload the built website artifact
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (GitHub API resolved)
        with:
          name: website
          path: website/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
