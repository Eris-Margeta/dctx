name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: apps/dctx-desktop
        run: bun install

      - name: Build frontend
        working-directory: apps/dctx-desktop
        run: bun run build

      - name: Build Tauri app
        working-directory: apps/dctx-desktop
        run: bun run tauri build -- --target ${{ matrix.platform.target }}

      - name: Prepare release artifacts (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: |
          cd apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle
          if [ -d "dmg" ]; then
            mv dmg/*.dmg dctx-desktop-${{ matrix.platform.arch }}.dmg || true
          fi
          if [ -d "macos" ]; then
            cd macos
            tar -czf ../dctx-desktop-${{ matrix.platform.arch }}.app.tar.gz *.app || true
          fi

      - name: Prepare release artifacts (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          cd apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle
          if (Test-Path "msi") {
            Get-ChildItem msi/*.msi | Rename-Item -NewName "dctx-desktop-${{ matrix.platform.arch }}.msi"
          }

      - name: Prepare release artifacts (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          cd apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle
          if [ -d "deb" ]; then
            mv deb/*.deb dctx-desktop-${{ matrix.platform.arch }}.deb || true
          fi
          if [ -d "appimage" ]; then
            mv appimage/*.AppImage dctx-desktop-${{ matrix.platform.arch }.AppImage || true
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/*.dmg
            apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/*.app.tar.gz
            apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/*.msi
            apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/*.deb
            apps/dctx-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/*.AppImage
          draft: false
          prerelease: true
          body: |
            # dctx Desktop ${{ github.ref_name }}

            ⚠️ **SECURITY NOTICE**: These binaries are NOT code-signed.

            ## Installation Instructions

            ### macOS
            You will see a security warning on first launch:
            1. Download the `.dmg` file for your architecture
            2. Open the DMG and drag app to Applications
            3. **Right-click** the app → **Open** → **Open** (to bypass Gatekeeper)
            4. After first launch, you can open normally

            **Architecture:**
            - Apple Silicon (M1/M2/M3): `arm64`
            - Intel: `x64`

            ### Windows
            You will see "Windows protected your PC":
            1. Download the `.msi` file
            2. Run the installer
            3. Click "**More info**" → "**Run anyway**"
            4. After first launch, no more warnings

            ### Linux
            No warnings! Install normally:

            **Debian/Ubuntu (.deb):**
            ```bash
            sudo dpkg -i dctx-desktop-x64.deb
            sudo apt-get install -f  # Fix dependencies if needed
            ```

            **Universal (AppImage):**
            ```bash
            chmod +x dctx-desktop-x64.AppImage
            ./dctx-desktop-x64.AppImage
            ```

            ## Why Unsigned?

            We're an open-source project and can't afford code signing certificates ($400/year).
            All source code is available for inspection at [github.com/your-repo/dctx](https://github.com/your-repo/dctx).

            **Prefer to build from source?** See [BUILDING.md](../../apps/dctx-desktop/BUILDING.md)

            ## What's New

            See [CHANGELOG.md](../../apps/dctx-desktop/CHANGELOG.md) for full release notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
