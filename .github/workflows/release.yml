name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      npm: ${{ steps.secrets.outputs.npm }}
      crates: ${{ steps.secrets.outputs.crates }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release version and notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
          ./tools/sync-version.sh --check
          ./tools/extract-changelog.sh "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
      - name: Check optional publishing credentials
        id: secrets
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo 'npm=true' >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then echo 'crates=true' >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            extension: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            extension: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            extension: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Install native musl linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
      - name: Build release
        run: cargo build --locked --release -p dctx-cli --bin dctx-cli --target ${{ matrix.target }}
      - name: Smoke test CLI (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/dctx-cli --version
      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        run: .\target\${{ matrix.target }}\release\dctx-cli.exe --version
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dctx-cli dist/dctx
          chmod 755 dist/dctx
          cp LICENSE NOTICE dist/
          COPYFILE_DISABLE=1 tar -czf dctx-${{ matrix.target }}.tar.gz -C dist dctx LICENSE NOTICE
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target\${{ matrix.target }}\release\dctx-cli.exe dist\dctx.exe
          Copy-Item LICENSE, NOTICE dist\
          Compress-Archive -Path dist\* -DestinationPath dctx-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dctx-${{ matrix.target }}
          path: dctx-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dctx-*
          path: artifacts
          merge-multiple: true
      - name: Checksums and changelog
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum dctx-*.tar.gz dctx-*.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
          ./tools/extract-changelog.sh "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
      - name: Create release with changelog notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag \
            --title "dctx $RELEASE_TAG" --notes-file release-notes.md "${extra[@]}"

  npm-publish:
    needs: [preflight, release]
    if: needs.preflight.outputs.npm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Prepare packages from released assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir artifacts --pattern 'dctx-*' --pattern SHA256SUMS
          python3 tools/release/prepare-npm.py "$RELEASE_TAG" artifacts
      - name: Publish platform packages, then shim
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then npm_tag=next; fi
          for package in packaging/npm/cli-* packaging/npm/dctx; do
            (cd "$package" && npm publish --provenance --access public --tag "$npm_tag")
          done

  crates-publish:
    needs: [preflight, release]
    if: needs.preflight.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: tools/release/publish-crates.sh
