name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  reproducibility:
    permissions:
      contents: read
    uses: ./.github/workflows/reproducible.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  preflight:
    runs-on: ubuntu-24.04
    outputs:
      npm: ${{ steps.secrets.outputs.npm }}
      crates: ${{ steps.secrets.outputs.crates }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release version and notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
          # Crate, lockfile and metadata versions must match. The public README is a curated
          # front page whose version badge may lag; that alone is a warning, not a failure.
          if ! ./tools/sync-version.sh --check 2> sync.err; then
            cat sync.err >&2
            if grep -v -x 'Version mismatch: README.md' sync.err | grep -q .; then exit 1; fi
            echo "::warning::README version badge does not match VERSION"
          fi
          ./tools/extract-changelog.sh "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
      - name: Check optional publishing credentials
        id: secrets
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo 'npm=true' >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then echo 'crates=true' >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            extension: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            extension: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            extension: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (GitHub API resolved)
        with:
          python-version: '3.12.8'
      - name: Install pinned release toolchain
        shell: bash
        run: |
          source tools/release/toolchain.env
          rustup toolchain install "$DCTX_RELEASE_RUST" --profile minimal --target '${{ matrix.target }}'
      - name: Install native musl C compiler (bundled SQLite)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build and package CLI
        shell: bash
        run: bash tools/release/build.sh '${{ matrix.target }}' dist
      - name: Generate CLI CycloneDX SBOM from Cargo metadata
        shell: bash
        run: |
          set -euo pipefail
          source tools/release/toolchain.env
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cargo +"$DCTX_RELEASE_RUST" install cargo-cyclonedx --version 0.5.10 --locked
          # Matches the release's default features and target; include transitive/build deps.
          cargo +"$DCTX_RELEASE_RUST" cyclonedx --manifest-path crates/dctx-cli/Cargo.toml \
            --format json --spec-version 1.5 --all --target '${{ matrix.target }}' \
            --override-filename release-sbom
          cp crates/dctx-cli/release-sbom.json 'dist/dctx-${{ matrix.target }}.cdx.json'
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (GitHub API resolved)
        with:
          name: dctx-${{ matrix.target }}
          path: |
            dist/dctx-${{ matrix.target }}.${{ matrix.extension }}
            dist/dctx-${{ matrix.target }}.cdx.json
          if-no-files-found: error

  sign:
    name: Sign and attest release payloads
    needs: [build, reproducibility]
    # OIDC exists only here: ordinary build/publish jobs cannot mint signing identities.
    # Dispatch the release workflow from the release tag so the identity also binds the tag.
    if: github.ref == format('refs/tags/{0}', inputs.tag || github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (GitHub API resolved)
        with:
          pattern: dctx-*
          path: artifacts
          merge-multiple: true
      - name: Bind the released Linux archive to the reproducibility result
        shell: bash
        env:
          EXPECTED_LINUX_SHA256: ${{ needs.reproducibility.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_LINUX_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_LINUX_SHA256" artifacts/dctx-x86_64-unknown-linux-musl.tar.gz | sha256sum --check
      - name: Install cosign (version and SHA-256 pinned)
        run: bash tools/release/install-cosign.sh
      - name: Attest every native archive
        id: archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3 (GitHub API resolved)
        with:
          subject-path: |
            artifacts/dctx-*.tar.gz
            artifacts/dctx-*.zip
      - name: Sign native archives, SBOMs and air-gap payloads
        shell: bash
        env:
          DCTX_CERTIFICATE_IDENTITY: https://github.com/Eris-Margeta/dctx/.github/workflows/release.yml@refs/tags/${{ env.RELEASE_TAG }}
          ARCHIVE_PROVENANCE: ${{ steps.archives.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ARCHIVE_PROVENANCE" artifacts/archive-provenance.jsonl
          python3 tools/release/supply-chain.py seal --artifacts artifacts --stage airgap \
            --epoch "$(git log -1 --format=%ct)"
      - name: Attest every air-gap archive
        id: airgap
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3 (GitHub API resolved)
        with:
          subject-path: artifacts/dctx-*-airgap.tar.gz
      - name: Sign provenance and final checksums
        shell: bash
        env:
          DCTX_CERTIFICATE_IDENTITY: https://github.com/Eris-Margeta/dctx/.github/workflows/release.yml@refs/tags/${{ env.RELEASE_TAG }}
          AIRGAP_PROVENANCE: ${{ steps.airgap.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$AIRGAP_PROVENANCE" artifacts/airgap-provenance.jsonl
          python3 tools/release/supply-chain.py finish --artifacts artifacts
          (cd artifacts && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (GitHub API resolved)
        with:
          name: signed-release
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (GitHub API resolved)
        with:
          name: signed-release
          path: artifacts
      - name: Create release with changelog notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check SHA256SUMS)
          ./tools/extract-changelog.sh "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag \
            --title "dctx $RELEASE_TAG" --notes-file release-notes.md "${extra[@]}"

  npm-publish:
    needs: [preflight, release]
    if: needs.preflight.outputs.npm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (GitHub API resolved)
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Prepare packages from released assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir artifacts --pattern 'dctx-*' --pattern SHA256SUMS
          python3 tools/release/prepare-npm.py "$RELEASE_TAG" artifacts
      - name: Publish platform packages, then shim
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then npm_tag=next; fi
          for package in packaging/npm/cli-* packaging/npm/dctx; do
            (cd "$package" && npm publish --access public --tag "$npm_tag")
          done

  crates-publish:
    needs: [preflight, release]
    if: needs.preflight.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install pinned release Rust
        shell: bash
        run: |
          source tools/release/toolchain.env
          rustup toolchain install "$DCTX_RELEASE_RUST" --profile minimal
          rustup default "$DCTX_RELEASE_RUST"
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: tools/release/publish-crates.sh
