name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: dctx-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: dctx-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: dctx-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: dctx-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dctx-cli dist/dctx
          chmod +x dist/dctx
          cd dist && tar -czvf ../${{ matrix.artifact }}.tar.gz dctx

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\dctx-cli.exe dist\dctx.exe
          Compress-Archive -Path dist\dctx.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG_ENTRY=$(./tools/extract-changelog.sh "$VERSION" || echo "")
          if [ -n "$CHANGELOG_ENTRY" ]; then
            echo "Found changelog entry for version $VERSION"
            # Save to file for use in release
            cat > release-notes.md << 'EOF'
          $CHANGELOG_ENTRY
          EOF
          else
            echo "No changelog entry found, will use auto-generated notes"
            echo "" > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
