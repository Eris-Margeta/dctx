# SPDX-License-Identifier: Apache-2.0
# One platform stage of the CI chain (called by ci.yml). Every OS/toolchain pair of a stage runs
# in parallel; the first failure cancels the rest of the stage and every later stage.
name: Tests

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner images for this stage
        required: true
        type: string
      filter:
        description: Optional cargo test name filter (targeted reruns)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}, ${{ matrix.toolchain }}
    # Linux on our own runners for upstream push events only; PR/fork code stays on hosted runners.
    runs-on: ${{ (matrix.os == 'ubuntu-24.04' && github.event_name == 'push' && github.repository == 'Eris-Margeta/dctx') && fromJSON('["self-hosted","Linux","X64","dctx","dctx-fast"]') || matrix.os }}
    # Allow headroom for cold builds and repository-scale tests on every host.
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        # Requested OS versions; see docs/TESTING.md for GitHub's macOS retirements.
        os: ${{ fromJSON(inputs.os) }}
        # Keep matrix labels unchanged for required-check names.
        toolchain: [stable, msrv]
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Go module caches are read-only; make any leftovers deletable so checkout can clean the workspace.
          chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (GitHub API resolved)
        with:
          persist-credentials: false

      # Own runners are Debian: only python3 exists, so provide `python` for the shared steps.
      - if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pyshim"
          ln -sf "$(command -v python3)" "$RUNNER_TEMP/pyshim/python"
          echo "$RUNNER_TEMP/pyshim" >> "$GITHUB_PATH"
      - if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Own runners: bootstrap rustup once into the runner user's home (no root needed).
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Own runners use their system Python (Debian has no 3.12 toolcache build).
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (GitHub API resolved)
        with:
          python-version: '3.12'

      - name: Install pack schema test dependencies
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install -r scripts/requirements.txt
          elif [ "${{ runner.environment }}" = self-hosted ]; then
            # Debian system python has no pip: use a throwaway venv and put it first on PATH.
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          else
            python3 -m pip install -r scripts/requirements.txt
          fi

      - name: Resolve CI and MSRV toolchains
        id: toolchain
        env:
          CHANNEL: ${{ matrix.toolchain }}
        run: |
          source tools/release/toolchain.env
          export DCTX_CI_RUST
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          msrv = (manifest.get("workspace", {}).get("package", {}).get("rust-version")
                  or manifest.get("package", {}).get("rust-version"))
          if not msrv:
              # Proposed floor: existing tests use Duration::from_mins (stable in 1.91).
              msrv = "1.91.0"
              print("::notice::No rust-version in Cargo.toml; testing proposed MSRV 1.91.0")
          version = msrv if os.environ["CHANNEL"] == "msrv" else os.environ["DCTX_CI_RUST"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PYTHON

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (GitHub API resolved)
        with:
          key: test-${{ matrix.os }}-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Workspace tests (including doctests)
        env:
          FILTER: ${{ inputs.filter }}
        # Native confinement rejects inherited descriptors beyond the protocol pipes.
        # The shared CLI tests/common helper owns environment isolation on every OS.
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          sys.exit(subprocess.call(
              ["cargo", "test", "--workspace", "--locked", "--no-fail-fast",
               "--exclude", "dctx-desktop", "--exclude", "dctx-desktop-api",
               *(["--", os.environ["FILTER"]] if os.environ["FILTER"] else [])],
              close_fds=True,
          ))
          PYTHON

      - name: Windows map-find per-call latency (informational)
        if: ${{ runner.os == 'Windows' }}
        continue-on-error: true
        env:
          DCTX_TIMINGS: '1'
        run: |
          cargo build --release --locked -p dctx-cli
          python tools/bench/map_find_latency.py --binary target/release/dctx-cli.exe --output target/map-find-latency.json
          python tools/bench/map_find_latency.py --binary target/release/dctx-cli.exe --scale-files 1551 --output target/map-find-latency-scale.json

      - name: Upload Windows map-find latency samples
        if: ${{ always() && runner.os == 'Windows' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (GitHub API resolved)
        with:
          name: map-find-latency-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            target/map-find-latency.json
            target/map-find-latency-scale.json
          if-no-files-found: warn

      - name: Linux map-find repository-scale latency (informational)
        if: ${{ runner.os == 'Linux' && matrix.os == fromJSON(inputs.os)[0] && matrix.toolchain == 'stable' }}
        continue-on-error: true
        env:
          DCTX_TIMINGS: '1'
        run: |
          cargo build --release --locked -p dctx-cli
          python tools/bench/map_find_latency.py --binary target/release/dctx-cli --scale-files 1551 --output target/map-find-latency-linux-scale.json

      - name: Upload Linux map-find scale latency samples
        if: ${{ always() && runner.os == 'Linux' && matrix.os == fromJSON(inputs.os)[0] && matrix.toolchain == 'stable' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (GitHub API resolved)
        with:
          name: map-find-latency-linux-scale
          path: target/map-find-latency-linux-scale.json
          if-no-files-found: warn
