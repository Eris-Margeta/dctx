# SPDX-License-Identifier: Apache-2.0
name: Windows map find latency

on:
  # Own workflow on every push to main and every PR, so its badge and commit check show its
  # real latest result (owner 23.11: every CI job visible on every commit). Manual runs stay.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  latency:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build release CLI
        run: |
          umask 022
          source tools/release/toolchain.env
          rustup toolchain install "$DCTX_RELEASE_RUST" --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/dctx-build"
          cargo +"$DCTX_RELEASE_RUST" build --release --locked -p dctx-cli
      - name: Test latency harness
        run: |
          umask 022
          python -m unittest scripts.test_win_latency -v
      - name: Measure 30 cold and 30 warm processes over 1500 files
        id: measure
        run: |
          umask 022
          python scripts/win_latency.py --binary "$RUNNER_TEMP/dctx-build/release/dctx-cli.exe" --runs 30 --files 1500 --max-p95-ms 500 --output target/win-latency/report.json
      - name: Upload latency JSON
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-latency
          path: target/win-latency/report.json
          if-no-files-found: error
          retention-days: 14
