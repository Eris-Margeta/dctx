# SPDX-License-Identifier: Apache-2.0
name: Windows map find latency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/win-latency
      CARGO_HOME: ${{ github.workspace }}/.cache/win-latency/cargo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build release CLI
        run: |
          umask 022
          source tools/release/toolchain.env
          rustup toolchain install "$DCTX_RELEASE_RUST" --profile minimal
          cargo +"$DCTX_RELEASE_RUST" build --release --locked -p dctx-cli
      - name: Test harness and measure 30 processes over 1500 files
        run: |
          umask 022
          python -m unittest scripts/test_win_latency.py
          python scripts/win_latency.py --binary target/win-latency/release/dctx-cli.exe --runs 30 --files 1500
      - name: Upload latency JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-latency
          path: target/win-latency/report.json
          if-no-files-found: error
          retention-days: 14
