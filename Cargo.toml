[workspace]
members = [
  "crates/*",
  # Plugin crates (PL-W). Membership only: dctx-cli does not depend on them,
  # so its strict default build contains no plugin worker until a CLI feature opts in.
  "plugins/*",
  "apps/dctx-desktop/src-tauri",
  # Bindings (future)
  # "bindings/dctx-py",
  # "bindings/dctx-node",
]
# plugins/index is the JSON index (PL-X), not a crate.
exclude = ["plugins/index"]
resolver = "2"
