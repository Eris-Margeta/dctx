[workspace]
members = [
  "crates/*",
  # Plugin crates (PL-W). dctx-cli's default `git-worker` feature depends on dctx-plugin-git;
  # only the strict build (--no-default-features --features strict) contains no plugin worker.
  "plugins/*",
  # Bindings (future)
  # "bindings/dctx-py",
  # "bindings/dctx-node",
]
# plugins/index is the JSON index (PL-X), not a crate. The desktop requires native
# GLib/GObject development libraries and is built separately on a provisioned host.
exclude = ["plugins/index", "apps/dctx-desktop/src-tauri"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/Eris-Margeta/dctx"
