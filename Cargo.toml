[workspace]
members = [
  "crates/*",
  # Plugin crates (PL-W). dctx-cli's default `git-worker` feature depends on dctx-plugin-git;
  # only the strict build (--no-default-features --features strict) contains no plugin worker.
  "plugins/*",
  "apps/dctx-desktop/src-tauri",
  # Bindings (future)
  # "bindings/dctx-py",
  # "bindings/dctx-node",
]
# plugins/index is the JSON index (PL-X), not a crate. tools/playground is the website playground server, built on its own.
exclude = ["plugins/index", "tools/playground"]
resolver = "2"

[workspace.package]
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Eris-Margeta/dctx"
homepage = "https://www.dctx.internet.technology"
readme = "README.md"
keywords = ["context", "cli", "code-analysis", "llm", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
