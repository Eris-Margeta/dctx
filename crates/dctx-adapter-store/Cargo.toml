[package]
name = "dctx-adapter-store"
version = "1.3.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Filesystem-backed immutable segments and manifest publication"

[dependencies]
dctx-hash = { version = "=1.3.0", path = "../dctx-hash" }
dctx-map-segment = { version = "=1.3.0", path = "../dctx-map-segment" }
thiserror = "=2.0.18"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
dctx-map-segment = { path = "../dctx-map-segment" }
proptest = "1"
tempfile = "=3.24.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
