[package]
name = "dctx-cli"
version = "1.3.1"
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for dctx context packs, structural maps, templates and cache management"

[features]
default = ["git-worker", "dctx/plugin-runtime"]
# Same-binary dctx/git worker. `--no-default-features` is the strict build: no worker crate.
git-worker = ["dep:dctx-plugin-git"]
# Cargo features are additive: strict requires --no-default-features.
# cargo tree -p dctx-cli --no-default-features --features strict -e normal
# Must exclude dctx-plugin-host, dctx-plugin-platform and dctx-plugin-git.
strict = ["dctx/pack", "dctx/map", "dctx/templates", "dctx/fs", "dctx/segments", "dctx/cache", "dctx/syntax-rust"]

[dependencies]
# syntax-rust is explicit: this crate disables dctx defaults, and without it every .rs file is refused.
dctx = { version = "=1.3.1", path = "../dctx", default-features = false, features = ["pack", "map", "templates", "fs", "segments", "cache", "syntax-rust", "rpc", "warm-index-cache"] }
dctx-adapter-cache = { version = "=1.3.1", path = "../dctx-adapter-cache" }
dctx-adapter-fs = { version = "=1.3.1", path = "../dctx-adapter-fs" }
dctx-core = { version = "=1.3.1", path = "../dctx-core" }
dctx-hash = { version = "=1.3.1", path = "../dctx-hash" }
dctx-pack = { version = "=1.3.1", path = "../dctx-pack" }
dctx-map-query = { version = "=1.3.1", path = "../dctx-map-query" }
dctx-plugin-distribution = { version = "=1.3.1", path = "../dctx-plugin-distribution" }
dctx-plugin-protocol = { version = "=1.3.1", path = "../dctx-plugin-protocol" }
dctx-template = { version = "=1.3.1", path = "../dctx-template" }
dctx-plugin-git = { version = "=1.3.1", path = "../../plugins/dctx-plugin-git", optional = true }

serde_json = "=1.0.149"
tempfile = "=3.24.0"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW differs between Unix targets and Linux architectures; never hard-code it.
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
proptest = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
