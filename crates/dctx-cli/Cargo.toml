[package]
name = "dctx-cli"
version = "0.25.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["git-worker"]
# Same-binary dctx/git worker. `--no-default-features` is the strict build: no worker crate.
git-worker = ["dep:dctx-plugin-git"]
strict = []

[dependencies]
dctx = { path = "../dctx" }
dctx-adapter-cache = { path = "../dctx-adapter-cache" }
dctx-core = { path = "../dctx-core" }
dctx-map-query = { path = "../dctx-map-query" }
dctx-plugin-distribution = { path = "../dctx-plugin-distribution" }
dctx-plugin-protocol = { path = "../dctx-plugin-protocol" }
dctx-template = { path = "../dctx-template" }
dctx-plugin-git = { path = "../../plugins/dctx-plugin-git", optional = true }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
proptest = "1"
