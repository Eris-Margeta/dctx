[package]
name = "dctx-daemon-transport"
version = "1.2.0"
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "User-only local IPC for the optional dctx daemon"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
