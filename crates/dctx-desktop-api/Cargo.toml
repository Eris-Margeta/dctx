[package]
name = "dctx-desktop-api"
version = "1.3.0"
edition = "2021"
publish = false
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "**Unstable** (no stability promise in v1). Pure desktop engine seam for snapshot, settings and recent projects"

[dependencies]
dctx = { version = "=1.3.0", path = "../dctx" }
dctx-core = { version = "=1.3.0", path = "../dctx-core" }
dctx-plugin-distribution = { version = "=1.3.0", path = "../dctx-plugin-distribution" }
dctx-template = { version = "=1.3.0", path = "../dctx-template" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW differs between Unix targets and Linux architectures; never hard-code it.
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
