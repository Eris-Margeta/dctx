[package]
name = "dctx-lex-rust"
version = "1.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Structural Rust extractor for dctx map mode, built on syn"

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
quote = { version = "=1.0.47", default-features = false }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
thiserror = "=2.0.18"

[dev-dependencies]
dctx-map-model = { path = "../dctx-map-model" }
dctx-map-parse = { path = "../dctx-map-parse" }
proptest = "1"
