[package]
name = "dctx-map-model"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "IO-free map domain: spans, precision, provenance, content identity and bounded answers"

# `wire-json` is the JSON v1 conversion for current dependents and the future wire adapter.
# `cargo build -p dctx-map-model --no-default-features` is the zero-external domain.
[features]
default = ["wire-json"]
wire-json = ["dep:serde", "dep:serde_json"]

[dependencies]
dctx-hash = { path = "../dctx-hash" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
