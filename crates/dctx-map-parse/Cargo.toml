[package]
name = "dctx-map-parse"
version = "1.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Per-file syntax facts for dctx map mode, with first-party extractors and an optional tree-sitter oracle"

# Default build is the pure-Rust extractor (decision 077). Tree-sitter is the optional
# differential oracle: `cargo test -p dctx-map-parse --features syntax-tree-sitter`.
[features]
syntax-tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-md",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
]

[dependencies]
dctx-map-model = { version = "=1.2.0", path = "../dctx-map-model" }
dctx-lex-rust = { version = "=1.2.0", path = "../dctx-lex-rust" }
dctx-lex-js = { version = "=1.2.0", path = "../dctx-lex-js" }
dctx-lex-md = { version = "=1.2.0", path = "../dctx-lex-md" }
dctx-lex-py = { version = "=1.2.0", path = "../dctx-lex-py" }
dctx-lex-go = { version = "=1.2.0", path = "../dctx-lex-go" }
dctx-lex-java = { version = "=1.2.0", path = "../dctx-lex-java" }
dctx-lex-c = { version = "=1.2.0", path = "../dctx-lex-c" }
dctx-lex-cfg = { version = "=1.2.0", path = "../dctx-lex-cfg" }
dctx-lex-cs = { version = "=1.2.0", path = "../dctx-lex-cs" }
dctx-lex-kt = { version = "=1.2.0", path = "../dctx-lex-kt" }
dctx-lex-rb = { version = "=1.2.0", path = "../dctx-lex-rb" }
dctx-lex-php = { version = "=1.2.0", path = "../dctx-lex-php" }
dctx-lex-swift = { version = "=1.2.0", path = "../dctx-lex-swift" }
dctx-hash = { version = "=1.2.0", path = "../dctx-hash" }
thiserror = "=2.0.18"
tree-sitter = { version = "=0.25.10", optional = true }
tree-sitter-rust = { version = "=0.24.0", optional = true }
tree-sitter-md = { version = "=0.3.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }

[dev-dependencies]
proptest = "1"
