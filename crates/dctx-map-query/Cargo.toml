[package]
name = "dctx-map-query"
version = "1.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Incremental indexing and bounded traversal for dctx map mode"

[dependencies]
dctx-map-model = { version = "=1.2.0", path = "../dctx-map-model" }
dctx-map-scan = { version = "=1.2.0", path = "../dctx-map-scan" }
dctx-map-parse = { version = "=1.2.0", path = "../dctx-map-parse" }
dctx-map-resolve = { version = "=1.2.0", path = "../dctx-map-resolve" }
dctx-map-store = { version = "=1.2.0", path = "../dctx-map-store" }
dctx-map-segment = { version = "=1.2.0", path = "../dctx-map-segment" }
dctx-ports = { version = "=1.2.0", path = "../dctx-ports" }
dctx-adapter-fs = { version = "=1.2.0", path = "../dctx-adapter-fs" }
dctx-adapter-store = { version = "=1.2.0", path = "../dctx-adapter-store" }
dctx-adapter-cache = { version = "=1.2.0", path = "../dctx-adapter-cache" }
dctx-core = { version = "=1.2.0", path = "../dctx-core" }
dctx-hash = { version = "=1.2.0", path = "../dctx-hash" }
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
tempfile = "=3.24.0"
