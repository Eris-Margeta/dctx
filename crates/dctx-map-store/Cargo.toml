[package]
name = "dctx-map-store"
version = "1.3.1"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Persistent graph facts, pack snapshots and a content-addressed comparison cache for dctx"

[dependencies]
dctx-core = { version = "=1.3.1", path = "../dctx-core" }
dctx-hash = { version = "=1.3.1", path = "../dctx-hash" }
dctx-map-model = { version = "=1.3.1", path = "../dctx-map-model" }
dctx-ports = { version = "=1.3.1", path = "../dctx-ports" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
proptest = "1"
