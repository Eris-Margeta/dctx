[package]
name = "dctx-map-store"
version = "1.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Persistent graph facts, pack snapshots and a content-addressed comparison cache for dctx"

[dependencies]
dctx-core = { path = "../dctx-core" }
dctx-hash = { path = "../dctx-hash" }
dctx-map-model = { path = "../dctx-map-model" }
dctx-ports = { path = "../dctx-ports" }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
proptest = "1"
