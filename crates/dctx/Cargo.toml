[package]
name = "dctx"
version = "1.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Stable dctx library facade for pack, map, templates and cache"

# `default` includes the optional plugin runtime; sessions still require an explicit host.
# Strict composition selects the six engine features without `plugin-runtime`.
# `default-features = false` still builds the pure types; disabled operations return
# `UnsupportedCapability`. `syntax-rust` is in the shipped default: PARSERS-v1 requires
# syn for Rust. A build without that feature refuses it instead of scanning Rust lines.
[features]
default = ["pack", "map", "templates", "fs", "segments", "cache", "plugin-runtime", "syntax-rust"]
plugin-runtime = ["dep:dctx-plugin-host", "dep:dctx-plugin-platform", "dep:dctx-plugin-protocol"]
pack = []
map = []
templates = []
fs = []
segments = []
cache = []
syntax-rust = ["dep:dctx-lex-rust"]
rpc = ["dep:serde", "dep:serde_json", "dep:schemars"]
wire-json = ["dctx-map-model/wire-json"]

[dependencies]
dctx-adapter-cache = { version = "=1.2.0", path = "../dctx-adapter-cache" }
dctx-core = { version = "=1.2.0", path = "../dctx-core" }
dctx-hash = { version = "=1.2.0", path = "../dctx-hash" }
dctx-lex-c = { version = "=1.2.0", path = "../dctx-lex-c" }
dctx-lex-cfg = { version = "=1.2.0", path = "../dctx-lex-cfg" }
dctx-lex-cs = { version = "=1.2.0", path = "../dctx-lex-cs" }
dctx-lex-go = { version = "=1.2.0", path = "../dctx-lex-go" }
dctx-lex-java = { version = "=1.2.0", path = "../dctx-lex-java" }
dctx-lex-js = { version = "=1.2.0", path = "../dctx-lex-js" }
dctx-lex-kt = { version = "=1.2.0", path = "../dctx-lex-kt" }
dctx-lex-md = { version = "=1.2.0", path = "../dctx-lex-md" }
dctx-lex-php = { version = "=1.2.0", path = "../dctx-lex-php" }
dctx-lex-py = { version = "=1.2.0", path = "../dctx-lex-py" }
dctx-lex-rb = { version = "=1.2.0", path = "../dctx-lex-rb" }
dctx-lex-rust = { version = "=1.2.0", path = "../dctx-lex-rust", optional = true }
dctx-lex-swift = { version = "=1.2.0", path = "../dctx-lex-swift" }
dctx-map-model = { version = "=1.2.0", path = "../dctx-map-model", default-features = false }
dctx-pack = { version = "=1.2.0", path = "../dctx-pack" }
dctx-ports = { version = "=1.2.0", path = "../dctx-ports" }
dctx-template = { version = "=1.2.0", path = "../dctx-template" }
dctx-plugin-host = { version = "=1.2.0", path = "../dctx-plugin-host", optional = true }
dctx-plugin-platform = { version = "=1.2.0", path = "../dctx-plugin-platform", optional = true }
dctx-plugin-protocol = { version = "=1.2.0", path = "../dctx-plugin-protocol", optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.149", optional = true }
schemars = { version = "=0.8.22", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "=3.24.0"

[[test]]
name = "plugin_audit"
required-features = ["plugin-runtime"]

[[test]]
name = "plugin_authority"
required-features = ["plugin-runtime", "pack", "templates"]

[[test]]
name = "plugin_recovery"
required-features = ["plugin-runtime", "fs"]

[[test]]
name = "fs_fixture"
required-features = ["fs", "map", "cache", "segments"]

[[test]]
name = "map_languages"
required-features = ["fs", "map"]

[[test]]
name = "golden"
required-features = ["map", "segments"]

[[test]]
name = "rust_default"
required-features = ["map", "syntax-rust"]

[[test]]
name = "hostile_walk"
required-features = ["fs", "map", "syntax-rust"]

[[test]]
name = "session"
required-features = ["pack", "map", "templates", "cache", "segments"]

[[test]]
name = "legacy_import"
required-features = ["pack"]

[[test]]
name = "legacy_output"
required-features = ["pack", "templates"]
