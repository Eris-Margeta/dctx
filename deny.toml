# Workspace licence policy, enforced by cargo-deny in CI.
# Keep the allow-list aligned with scripts/third_party.py (the shipped CLI index).

[graph]
# All targets: the same superset scripts/third_party.py checks without --target.
all-features = false

[licenses]
version = 2
# Keep in sync with ALLOWED in scripts/third_party.py.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are licensed Apache-2.0, checked by scripts/spdx_check.sh.
ignore = true

[advisories]
# Exceptions name the advisory, the affected path, the reason and an expiry.
# The shipped CLI (dctx-cli) must reach none of them.
ignore = [
  # proc-macro-error 1.0.4 (unmaintained): build-time proc macro reached only through
  # dctx-desktop -> tauri -> gtk 0.18 -> glib-macros. No maintained gtk3 release drops it.
  # Desktop is deferred; expires when the desktop work resumes or on 2027-03-01.
  { id = "RUSTSEC-2024-0370", reason = "desktop-only build-time proc macro (tauri gtk 0.18); expires 2027-03-01" },
]
