\* DX-A2 pass: publication, crash, reader pin, LRU, cap. Fairness is in FairSpec.
\* P8 does not use the logical clock. CHECK_DEADLOCK is off because a finished
\* finite run has no further action; liveness distinguishes that from a stuck writer.
SPECIFICATION FairSpec
CONSTANTS
  Mutation = "none"
  Cap = 5
  Soft = 4
  Unit = 2
  LegacyExtra = 0
  UserPin = 0
  MaxNow = 1
  Ttl = 1
  MaxAcquires = 1
  MaxCrashes = 1
INVARIANT TypeOK
INVARIANT P2
INVARIANT P3
INVARIANT P4
INVARIANT NoGitOwnership
INVARIANT PinHolds
PROPERTY P8
CHECK_DEADLOCK FALSE
