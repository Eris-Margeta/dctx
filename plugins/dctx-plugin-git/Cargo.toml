[package]
name = "dctx-plugin-git"
version = "1.3.0"
edition = "2024"
description = "The bundled dctx/git plugin: local .gitignore protection and brokered staging (PLUGINS.md §6)"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dctx-plugin-git"
path = "src/main.rs"

[dependencies]
dctx-plugin-protocol = { version = "=1.3.0", path = "../../crates/dctx-plugin-protocol" }

[dev-dependencies]
dctx-hash = { path = "../../crates/dctx-hash" }
proptest = "1"
