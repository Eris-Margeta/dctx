[package]
name = "dctx-play"
version = "1.1.0"
edition = "2021"
description = "The dctx website playground: runs the real dctx binary on a sample or pasted files, behind a small HTTP API."
license = "Apache-2.0"
repository = "https://github.com/Eris-Margeta/dctx"
publish = false

# Standard library only. Not a member of the dctx workspace (see the root Cargo.toml exclude).
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
