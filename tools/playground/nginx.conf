# nginx site config for www.dctx.internet.technology (conf.d/default.conf of the dctx-site service).
# Static files from /usr/share/nginx/html; /api/ goes to the playground service.

# Content-hashed assets never change; everything else is revalidated.
map $uri $dctx_cache {
    "~^/assets/.+\.[0-9a-f]{8}\.(css|js|woff2)$"  "public, max-age=31536000, immutable";
    ~^/assets/search-index\.json$               "no-cache";
    ~^/assets/                                  "public, max-age=86400";
    ~^/api/                                     "";
    default                                     "no-cache";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/atom+xml application/manifest+json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/atom+xml application/manifest+json application/opensearchdescription+xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-7aFRmb2EZ7yAtMXkpPYgUPQVRKuFx92DpbFFB5sRGTQ='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
    add_header Cache-Control $dctx_cache always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Markdown twins and machine files as text.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }
    location ~ ^/(llms|llms-small|llms-full|humans|robots)\.txt$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    location = /opensearch.xml {
        types { }
        default_type application/opensearchdescription+xml;
    }

    # The playground API. The variable defers DNS, so nginx starts while dctx-play is down;
    # then the page falls back to its recorded runs and a form post gets the offline page.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $dctx_play http://dctx-play:8080;
        proxy_pass $dctx_play;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        client_max_body_size 600k;
        error_page 502 504 =503 /playground/offline/index.html;
    }
}
